name: update-and-deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'site/bandi.json'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Scarica e classifica bandi
        run: python3 monitor.py

      - name: Committa lo snapshot dei dati
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/bandi.json
          if git diff --cached --quiet; then
            echo "Nessun dato nuovo: nessun commit."
          else
            git commit -m "data: aggiornamento bandi"
            git push
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
